services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: powertwin_timescaledb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-powertwin}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set - export a strong secret of at least 20 characters}"
      POSTGRES_DB: ${POSTGRES_DB:-powertwin_db}
    ports:
      - "127.0.0.1:5432:5432"  # Bound strictly to loopback interface
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-powertwin} -d ${POSTGRES_DB:-powertwin_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # An explicit, one-shot migration run. The application never starts it:
  # applying the schema is an operator action, not a startup step, and it has
  # to run exactly once before the first worker starts. Running it from inside
  # the application would execute it once per worker instance, and every
  # worker would then do the same thing on every restart of the deployment.
  #
  # The command reads the database URL from the same environment values the
  # backend reads, so a replace of the credentials is one change rather than
  # two. The migration stub ships no version pin of its own to prove the
  # migration it applies matches the release.
  migrate:
    image: powertwin-backend:latest
    container_name: powertwin_migrate
    environment:
      POSTGRES_SERVER: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-powertwin}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set - export a strong secret of at least 20 characters}"
      POSTGRES_DB: ${POSTGRES_DB:-powertwin_db}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: "True"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ../backend:/app/backend
      - ../plugins:/app/plugins
      - ../configs:/app/configs
      - ../tests:/app/tests
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: "no"
    command: ["python", "-m", "alembic", "-c", "backend/alembic.ini", "upgrade", "head"]

  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
    container_name: powertwin_backend
    environment:
      POSTGRES_SERVER: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-powertwin}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set - export a strong secret of at least 20 characters}"
      POSTGRES_DB: ${POSTGRES_DB:-powertwin_db}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-True}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # The operator-action journal is the platform's append-only, tamper-evident
      # audit trail. It lives on a named volume so that it survives a container
      # replacement: a trail that disappears with the container it was written
      # in cannot answer a warranty or dispute question.
      OPERATOR_JOURNAL_PATH: /app/var/operator_actions.jsonl
    volumes:
      - operator_journal:/app/var
    ports:
      - "127.0.0.1:8000:8000"  # Bound strictly to loopback interface
    depends_on:
      timescaledb:
        condition: service_healthy
      migrate:
        # The schema is migrated by the one-shot `migrate` service, which the
        # operator starts deliberately. A worker must never start against a
        # database that the migration has not been run against.
        condition: service_completed_successfully
    healthcheck:
      # The probe uses the Python standard library, so the backend image ships
      # no HTTP client of its own and the runtime layer stays minimal.
      test: ["CMD", "python", "/app/deployment/healthcheck.py", "/health/liveness"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.frontend
    container_name: powertwin_frontend
    ports:
      - "127.0.0.1:5173:80"  # Bound strictly to loopback interface
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  operator_journal:
    driver: local
