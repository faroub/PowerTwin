# Pytest configuration for the PowerTwin repository.
#
# Why this file is at the repository root
# ---------------------------------------
# The test suite lives in ``tests/`` at the repository root, and every
# invocation - local and in CI - runs pytest from the repository root:
#
#     PYTHONPATH=. pytest
#
# Pytest discovers its configuration by walking **up** from the directory it
# is invoked in. A ``[tool.pytest.ini_options]`` section inside
# ``backend/pyproject.toml`` is therefore never read, because pytest is
# never invoked from inside ``backend/``. That section was inert: it looked
# authoritative while changing nothing.
#
# This file is the single, authoritative pytest configuration. It lives at the
# same level as the tests and at the same level the pipeline runs from, so
# that a local run and a CI run execute the same tests with the same
# settings.
#
# ``pytest.ini`` is used rather than ``pyproject.toml`` on purpose. Pytest
# gives it the highest precedence, and Ruff, which also discovers its
# configuration per directory, never considers it.

[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py

# The async tests drive the FastAPI application and the historian, so
# pytest-asyncio has to run them. ``auto`` means that an ``async def`` test
# is executed even when it carries no explicit marker.
asyncio_mode = auto

# Pin the event-loop scope of pytest-asyncio instead of relying on the
# library default, which is deprecated and will change in a future release.
asyncio_default_fixture_loop_scope = function
