# PowerTwin Controller-in-the-Loop (CIL) Integration Configuration
# Configures isolated protocol gateway for external PPC / EMS controller testing.
#
# SAFETY: this configuration only ever describes a SIMULATED plant. The
# gateway never opens an outbound connection and never touches physical
# equipment. The listener is refused for any bind address that is not a
# loopback address, so this file cannot be used to target real hardware.

cil_mode: "CONTROLLER_IN_THE_LOOP"
safety_guardrails:
  application_mode: "SIMULATION ONLY"
  hardware_integration_enabled: false
  allow_external_modbus_writes: true   # Explicitly enabled for CIL simulation testing
  bind_host: "127.0.0.1"               # Strictly bound to loopback

gateway:
  protocol: "MODBUS_TCP"
  # The listener is disabled by default and must be enabled deliberately.
  # Setting this to false means that no socket is opened at all.
  enabled: false
  host: "127.0.0.1"
  port: 5020
  watchdog_timeout_ms: 5000
  register_map_version: "1.0.0"

# Holding register map. The addresses, types, access rights and value ranges
# below are the ones the gateway actually enforces; a write that violates
# them is rejected with a Modbus exception and audited.
#
# Wire encoding: a 32-bit value occupies two consecutive 16-bit registers,
# high word first (big-endian word order). A 16-bit value occupies one
# register.
modbus_register_mappings:
  - address: 0
    name: "PLANT_ACTIVE_POWER_MW"
    type: "FLOAT32"
    unit: "MW"
    access: "READ_ONLY"
    description: "Plant Net Active Power Export (+MW)"

  - address: 2
    name: "PLANT_REACTIVE_POWER_MVAR"
    type: "FLOAT32"
    unit: "MVAR"
    access: "READ_ONLY"
    description: "Plant Net Reactive Power (+MVAR)"

  - address: 4
    name: "POI_VOLTAGE_KV"
    type: "FLOAT32"
    unit: "kV"
    access: "READ_ONLY"
    description: "POI AC Nominal Voltage"

  - address: 6
    name: "GRID_FREQUENCY_HZ"
    type: "FLOAT32"
    unit: "Hz"
    access: "READ_ONLY"
    description: "Grid Operating Frequency"

  - address: 8
    name: "AVERAGE_SOC_PCT"
    type: "FLOAT32"
    unit: "pct"
    access: "READ_ONLY"
    description: "Plant Average State of Charge"

  - address: 10
    name: "EQUIPMENT_AVAILABILITY_PCT"
    type: "FLOAT32"
    unit: "pct"
    access: "READ_ONLY"
    description: "Plant Equipment Availability Percentage"

  - address: 12
    name: "ACTIVE_ALARMS_COUNT"
    type: "UINT32"
    unit: "count"
    access: "READ_ONLY"
    description: "Total Active Critical Alarms Count"

  - address: 100
    name: "COMMAND_ACTIVE_POWER_W"
    type: "FLOAT32"
    unit: "W"
    access: "READ_WRITE"
    min_value: -50000000.0
    max_value: 50000000.0
    description: "Active Power Setpoint (+W Discharge, -W Charge)"

  - address: 102
    name: "COMMAND_REACTIVE_POWER_VAR"
    type: "FLOAT32"
    unit: "VAR"
    access: "READ_WRITE"
    min_value: -50000000.0
    max_value: 50000000.0
    description: "Reactive Power Setpoint (+VAR Supply, -VAR Absorb)"

  - address: 104
    name: "WATCHDOG_HEARTBEAT_COUNTER"
    type: "UINT32"
    unit: "count"
    access: "READ_WRITE"
    min_value: 0.0
    max_value: 4294967295.0
    description: "External Controller Watchdog Heartbeat Counter"

  - address: 106
    name: "COMMAND_EMS_MODE"
    type: "UINT16"
    unit: "enum"
    access: "READ_WRITE"
    min_value: 0.0
    max_value: 3.0
    description: "EMS Operational Mode (0=MANUAL, 1=SCHEDULED, 2=PEAK, 3=FREQUENCY)"

  - address: 108
    name: "COMMAND_RESET_FAULTS"
    type: "UINT16"
    unit: "flag"
    access: "READ_WRITE"
    min_value: 0.0
    max_value: 1.0
    description: "Reset Active Equipment Faults (1 = Reset)"
