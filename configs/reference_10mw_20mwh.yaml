# PowerTwin Reference Plant Configuration 1 (10 MW / 20 MWh)
# Demo parameters: 10 MW nominal power, 20 MWh energy, 4 containers, 4 PCS, 50 Hz grid.

plant_id: "REF_PLANT_10MW_20MWH"
name: "PowerTwin Reference 10 MW / 20 MWh BESS Plant"
rated_power_w: 10000000.0        # 10 MW
rated_energy_wh: 20000000.0      # 20 MWh

containers:
  - container_id: "CONTAINER_01"
    plugin_id: "generic_battery_v1"
    vendor: "Reference Cell Co"
    capacity_wh: 5000000.0       # 5 MWh
    nominal_voltage_v: 1000.0
    racks_count: 16
    initial_soc_pct: 50.0

  - container_id: "CONTAINER_02"
    plugin_id: "generic_battery_v1"
    vendor: "Reference Cell Co"
    capacity_wh: 5000000.0       # 5 MWh
    nominal_voltage_v: 1000.0
    racks_count: 16
    initial_soc_pct: 50.0

  - container_id: "CONTAINER_03"
    plugin_id: "generic_battery_v1"
    vendor: "Reference Cell Co"
    capacity_wh: 5000000.0       # 5 MWh
    nominal_voltage_v: 1000.0
    racks_count: 16
    initial_soc_pct: 50.0

  - container_id: "CONTAINER_04"
    plugin_id: "generic_battery_v1"
    vendor: "Reference Cell Co"
    capacity_wh: 5000000.0       # 5 MWh
    nominal_voltage_v: 1000.0
    racks_count: 16
    initial_soc_pct: 50.0

pcs_units:
  - pcs_id: "PCS_01"
    plugin_id: "generic_pcs_v1"
    vendor: "Reference Inverter Co"
    rated_active_power_w: 2500000.0    # 2.5 MW
    rated_apparent_power_va: 2750000.0 # 2.75 MVA
    ac_voltage_v: 690.0

  - pcs_id: "PCS_02"
    plugin_id: "generic_pcs_v1"
    vendor: "Reference Inverter Co"
    rated_active_power_w: 2500000.0    # 2.5 MW
    rated_apparent_power_va: 2750000.0 # 2.75 MVA
    ac_voltage_v: 690.0

  - pcs_id: "PCS_03"
    plugin_id: "generic_pcs_v1"
    vendor: "Reference Inverter Co"
    rated_active_power_w: 2500000.0    # 2.5 MW
    rated_apparent_power_va: 2750000.0 # 2.75 MVA
    ac_voltage_v: 690.0

  - pcs_id: "PCS_04"
    plugin_id: "generic_pcs_v1"
    vendor: "Reference Inverter Co"
    rated_active_power_w: 2500000.0    # 2.5 MW
    rated_apparent_power_va: 2750000.0 # 2.75 MVA
    ac_voltage_v: 690.0

transformers:
  - transformer_id: "XFRM_MAIN_01"
    rating_va: 11000000.0        # 11 MVA (Covers 4 * 2.75 MVA PCS)
    primary_voltage_v: 690.0
    secondary_voltage_v: 13800.0

switchgear:
  - switchgear_id: "SWG_MAIN_01"
    rated_voltage_v: 13800.0
    rated_current_a: 2000.0

auxiliary_systems:
  - aux_id: "AUX_SYS_01"
    plugin_id: "dummy_auxiliary_v1"
    aux_base_power_w: 10000.0

meters:
  - meter_id: "MTR_POI_01"
    nominal_voltage_v: 13800.0

poi:
  poi_id: "POI_01"
  nominal_voltage_v: 13800.0
  max_export_power_w: 10000000.0 # 10 MW POI limit
  max_import_power_w: 10000000.0 # 10 MW POI limit

grid:
  grid_id: "GRID_50HZ_01"
  plugin_id: "dummy_grid_v1"
  nominal_frequency_hz: 50.0     # 50 Hz Nominal
  nominal_voltage_v: 13800.0
  short_circuit_mva: 500.0

ppc:
  ppc_id: "PPC_MAIN_01"
  plant_rated_active_power_w: 10000000.0
  plant_rated_apparent_power_va: 11000000.0
