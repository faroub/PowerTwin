# PowerTwin Production Configuration Template
project_name: "PowerTwin BESS Simulator (Prod)"
environment: "production"
debug: false

# Required: a strong database password must be supplied via the
# `POSTGRES_PASSWORD` environment variable on both the server and the
# client container.  No placeholder value is embedded here.
safety:
  application_mode: "SIMULATION ONLY"
  simulation_only: true
  hardware_integration_enabled: false
  allow_external_modbus_writes: false
  automatic_device_discovery_enabled: false

server:
  host: "0.0.0.0"

database:
  server: "${POSTGRES_SERVER}"
  port: 5432
  user: "${POSTGRES_USER:-powertwin}"
  password: "${POSTGRES_PASSWORD}"
  db_name: "${POSTGRES_DB}"

simulation_defaults:
  tick_rate_hz: 100
  default_step_ms: 10
  random_seed: 42
