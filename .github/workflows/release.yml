name: Release Build & Artifact Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release Version Tag (e.g. v1.0.0). Used to name the artefacts of a packaging rehearsal that is not published as a GitHub release.'
        required: true
        default: 'v1.0.0'

# Least privilege: the workflow itself may only read the repository. Writing a
# release is granted to the single job that actually publishes it.
permissions:
  contents: read

jobs:
  release-build:
    name: Build & Package Release Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve and Validate the Release Version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          if [ "${REF_TYPE}" = "tag" ]; then
            CANDIDATE="${REF_NAME}"
            echo "The release version is taken from the pushed tag."
          else
            CANDIDATE="${INPUT_VERSION}"
            echo "The release version is taken from the workflow input."
          fi
          echo "Validating the release version '${CANDIDATE}'..."
          python scripts/validate_release_version.py "${CANDIDATE}"
          echo "release_version=${CANDIDATE}" >> "$GITHUB_ENV"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.lock
            backend/requirements-ci.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # The runtime dependencies are installed from the lock, with
          # --require-hashes, so a release ships exactly the versions the
          # lock records and pip refuses any artefact whose hash does not
          # match the recorded one.
          pip install --require-hashes -r backend/requirements.lock
          pip install -r backend/requirements-ci.txt
          cd frontend && npm ci

      - name: Verify the Dependency Lock Matches the Declared Requirements
        run: |
          python scripts/check_dependency_lock.py

      - name: Validate Database Migrations
        run: |
          python scripts/validate_migrations.py

      - name: Run Full Pytest Suite
        run: |
          PYTHONPATH=. pytest -W "error::pytest.PytestUnraisableExceptionWarning"

      - name: Build Web HMI Frontend
        run: |
          cd frontend && npm run build

      - name: Record Python and Node Dependency Inventory for SBOM
        run: |
          mkdir -p release_artifacts
          pip list --format=json > release_artifacts/python_packages.json
          cd frontend && npm ls --json --all > ../release_artifacts/npm_packages.json

      - name: Generate Software Bill of Materials (SBOM) & Checksums
        run: |
          python scripts/generate_sbom.py "${RELEASE_VERSION}" \
            --output release_artifacts/sbom.spdx.json

          # The SBOM and the dependency inventories it was derived from are
          # part of the release archive, so that the released artefacts carry
          # the evidence of what they were built from.
          tar -czf "release_artifacts/powertwin-release-${RELEASE_VERSION}.tar.gz" \
            configs/ \
            deployment/ \
            docs/ \
            frontend/dist/ \
            docker-compose.yml \
            AGENTS.md \
            release_artifacts/sbom.spdx.json \
            release_artifacts/python_packages.json \
            release_artifacts/npm_packages.json

          cd release_artifacts
          sha256sum powertwin-release-*.tar.gz sbom.spdx.json python_packages.json npm_packages.json > SHA256SUMS

      - name: Build & Scan Docker Release Images
        run: |
          docker build -t "powertwin-backend:${RELEASE_VERSION}" -f deployment/Dockerfile.backend .
          docker build -t "powertwin-frontend:${RELEASE_VERSION}" -f deployment/Dockerfile.frontend .

      - name: Upload Release Artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: powertwin-release-${{ env.release_version }}
          path: release_artifacts/
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release_artifacts/*
          body: |
            ## PowerTwin Industrial BESS Simulator Release ${{ env.release_version }}

            ### Release Highlights
            - Full 100 Hz deterministic simulation engine
            - Standardized 12 equipment interfaces and plugin architecture
            - 3-tier control architecture (Equipment Controller, PPC, EMS)
            - 19-view SCADA Web HMI with interactive Single-Line Diagram
            - TimescaleDB time-series historian with zero silent data loss buffer
            - Modbus TCP CIL protocol gateway bound to loopback `127.0.0.1:5020`
            - 4 vendor equipment plugins (CATL EnerOne, Tesla Megapack, SMA Sunny Central, Sungrow SC5000)

            ### Release Evidence
            - SPDX-2.3 software bill of materials: `sbom.spdx.json`
            - Dependency inventories: `python_packages.json`, `npm_packages.json`
            - SHA-256 checksums of every released file: `SHA256SUMS`

            **SAFETY NOTE:** This release operates strictly in **SIMULATION ONLY** mode. Automatic deployment to physical BESS hardware or live OT networks is disabled.
