name: Release Build & Artifact Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release Version Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release-build:
    name: Build & Package Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          cd frontend && npm ci

      - name: Validate Database Migrations
        run: |
          cd backend && alembic check

      - name: Run Full Pytest Suite
        run: |
          PYTHONPATH=. pytest

      - name: Build Web HMI Frontend
        run: |
          cd frontend && npm run build

      - name: Record Python and Node Dependency Inventory for SBOM
        run: |
          pip list --format=json > python_packages.json
          cd frontend && npm ls --json --all --depth=0 > npm_packages.json
        env:
          # Python and Node dependencies were installed in the earlier step.

      - name: Generate Software Bill of Materials (SBOM) & Checksums
        run: |
          mkdir -p release_artifacts
          python scripts/generate_sbom.py ${{ github.ref_name }}

          tar -czf release_artifacts/powertwin-release-${{ github.ref_name }}.tar.gz \
            configs/ \
            deployment/ \
            docs/ \
            frontend/dist/ \
            docker-compose.yml \
            AGENTS.md

          cd release_artifacts
          sha256sum * > SHA256SUMS

      - name: Build & Scan Docker Release Images
        run: |
          docker build -t powertwin-backend:${{ github.ref_name }} -f deployment/Dockerfile.backend .
          docker build -t powertwin-frontend:${{ github.ref_name }} -f deployment/Dockerfile.frontend .

      - name: Upload Release Artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: powertwin-release-${{ github.ref_name }}
          path: release_artifacts/
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release_artifacts/*
          body: |
            ## PowerTwin Industrial BESS Simulator Release ${{ github.ref_name }}

            ### Release Highlights
            - Full 100 Hz deterministic simulation engine
            - Standardized 12 equipment interfaces and plugin architecture
            - 3-tier control architecture (Equipment Controller, PPC, EMS)
            - 19-view SCADA Web HMI with interactive Single-Line Diagram
            - TimescaleDB time-series historian with zero silent data loss buffer
            - Modbus TCP CIL protocol gateway bound to loopback `127.0.0.1:5020`
            - 4 vendor equipment plugins (CATL EnerOne, Tesla Megapack, SMA Sunny Central, Sungrow SC5000)

            **SAFETY NOTE:** This release operates strictly in **SIMULATION ONLY** mode. Automatic deployment to physical BESS hardware or live OT networks is disabled.
