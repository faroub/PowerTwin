name: Security & Vulnerability Scanning

on:
  # Every pull request is scanned, whatever branch it targets.
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'  # Run daily at 03:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  codeql-analysis:
    name: CodeQL Static Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: python, javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

  dependency-audit:
    name: Python & npm Dependency Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-ci.txt

      - name: Python Dependency Audit (pip-audit)
        run: |
          # pip-audit is pinned in backend/requirements-ci.txt so that the audit
          # is reproducible and cannot silently change behaviour.
          pip install -r backend/requirements-ci.txt
          pip-audit -r backend/requirements.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: npm Security Audit
        run: |
          cd frontend
          npm ci
          npm audit --audit-level=high

  secret-scanning:
    name: Secret & Credential Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Secret Scan (TruffleHog)
        uses: trufflesecurity/trufflehog@d232362a64a09a9e7d58267b8f5acef00ae90e23 # v3.100.0
        with:
          extra_args: --only-verified

  container-security-scan:
    name: Docker Image Security Scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build Backend Image
        run: |
          docker build -t powertwin-backend:scan -f deployment/Dockerfile.backend .

      - name: Build Frontend Image
        run: |
          docker build -t powertwin-frontend:scan -f deployment/Dockerfile.frontend .

      # The two scans below enforce two different policies, because the two
      # package families have two different owners.
      #
      # Operating-system packages belong to the Debian base image. The
      # upstream distribution is the only party that can publish a fix for
      # them, and it has not yet published one for the advisories that the
      # base image still carries. This scan therefore fails on every
      # CRITICAL or HIGH advisory that HAS a fix available, and the image
      # build applies `apt-get upgrade` so that the newest published patches
      # are always present. The day the distribution publishes a fix, the
      # advisory stops being "unfixed", the scan starts reporting it, and the
      # build fails until the image picks the patch up. The gate therefore
      # cannot silently rot.
      - name: Scan Backend Image — Operating-System Packages (fixable only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "powertwin-backend:scan"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          vuln-type: "os"
          ignore-unfixed: "true"

      # Python packages belong to this project. Every one of them can be
      # upgraded by changing a pin in backend/requirements.txt, so this scan
      # holds them to the strictest policy: no CRITICAL and no HIGH advisory
      # is accepted, whether or not a fix exists yet. The inherited
      # unfixable Debian advisories cannot mask a finding here, because the
      # scan is restricted to the Python package family.
      - name: Scan Backend Image — Python Packages (strict)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "powertwin-backend:scan"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          vuln-type: "library"

      # The frontend image is deployed exactly like the backend image, so it
      # is scanned exactly like the backend image and under the same two
      # policies. It was previously not scanned at all.
      - name: Scan Frontend Image — Operating-System Packages (fixable only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "powertwin-frontend:scan"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          vuln-type: "os"
          ignore-unfixed: "true"

      - name: Scan Frontend Image — Application Packages (strict)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "powertwin-frontend:scan"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          vuln-type: "library"
