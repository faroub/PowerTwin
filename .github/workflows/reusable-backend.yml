name: Reusable Backend CI

on:
  workflow_call:
    outputs:
      coverage-percent:
        description: "Backend line coverage percentage"
        value: ${{ jobs.backend-test.outputs.coverage }}

permissions:
  contents: read

jobs:
  backend-lint-and-typecheck:
    name: Backend Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Formatting (Ruff)
        run: ruff format --check backend plugins tests

      - name: Run Linter (Ruff)
        run: ruff check backend plugins tests

      - name: Run Type Checker (Mypy)
        run: mypy --config-file backend/pyproject.toml backend plugins

  backend-test:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.cov.outputs.percentage }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest with Coverage
        run: |
          PYTHONPATH=. pytest --cov=backend/app --cov=plugins --cov-branch --cov-report=xml:coverage.xml --cov-report=term-missing

      - name: Extract Real Coverage Percentage
        id: cov
        run: |
          COVERAGE=$(python -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); root = tree.getroot(); print(f'{float(root.attrib[\"line-rate\"])*100:.1f}')")
          echo "percentage=$COVERAGE" >> $GITHUB_OUTPUT
          echo "Extracted Backend Coverage: $COVERAGE%"

      - name: Upload Coverage Artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage-report
          path: coverage.xml
          retention-days: 7
