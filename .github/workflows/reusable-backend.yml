name: Reusable Backend CI

on:
  workflow_call:
    outputs:
      coverage-percent:
        description: "Backend line coverage percentage enforced by the coverage policy"
        value: ${{ jobs.backend-test.outputs.coverage }}

permissions:
  contents: read

jobs:
  backend-lint-and-typecheck:
    name: Backend Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.lock
            backend/requirements-ci.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # The runtime dependencies are installed from the lock, with
          # --require-hashes, so the pipeline exercises exactly the versions
          # the container image ships and pip refuses any artefact whose hash
          # does not match the recorded one.
          pip install --require-hashes -r backend/requirements.lock
          pip install -r backend/requirements-ci.txt

      - name: Verify the Dependency Lock Matches the Declared Requirements
        run: python scripts/check_dependency_lock.py

      # The lock says which versions must be installed; this says that the
      # versions that are installed are those. It also catches the toolchain
      # install above quietly replacing a runtime package with another one.
      - name: Verify the Installed Environment Matches the Lock
        run: python scripts/verify_locked_environment.py --lock backend/requirements.lock

      - name: Verify Formatting (Ruff)
        run: ruff format --check backend plugins tests scripts deployment

      - name: Run Linter (Ruff)
        run: ruff check backend plugins tests scripts deployment

      - name: Run Type Checker (Mypy)
        run: mypy --config-file backend/pyproject.toml backend plugins scripts

  backend-test:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      coverage: ${{ steps.cov.outputs.percentage }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.lock
            backend/requirements-ci.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # The runtime dependencies are installed from the lock, with
          # --require-hashes, so the pipeline exercises exactly the versions
          # the container image ships and pip refuses any artefact whose hash
          # does not match the recorded one.
          pip install --require-hashes -r backend/requirements.lock
          pip install -r backend/requirements-ci.txt

      # The output is captured so that a failure can be reported as a
      # check-run annotation. `pipefail` is what keeps the pipeline honest:
      # without it `tee` would decide the exit status and a failing test
      # suite would pass the job.
      - name: Run Pytest with Coverage
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. pytest \
            --cov=backend/app \
            --cov=plugins \
            --cov-branch \
            --cov-report=xml:coverage.xml \
            --cov-report=json:coverage.json \
            --cov-report=term-missing \
            --junitxml=junit.xml \
            -W "error::pytest.PytestUnraisableExceptionWarning" \
            2>&1 | tee pytest-output.txt

      # A failing pipeline has to name the test that failed. The job log can
      # only be downloaded with repository administration rights, so the
      # failures are turned into check-run annotations, which the API exposes
      # to everyone who can read the repository.
      - name: Report the Failed Tests
        if: always()
        run: |
          python scripts/summarize_pytest_failures.py junit.xml
          {
            echo "## Backend test report"
            echo
            echo '```text'
            tail -n 100 pytest-output.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Extract Real Coverage Percentage
        id: cov
        run: |
          COVERAGE=$(python -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); root = tree.getroot(); print(f'{float(root.attrib[\"line-rate\"])*100:.1f}')")
          echo "percentage=$COVERAGE" >> $GITHUB_OUTPUT
          echo "Extracted Backend Coverage: $COVERAGE%"

      - name: Enforce the Coverage Policy
        run: python scripts/check_coverage.py coverage.json

      - name: Upload Coverage Artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage-report
          path: |
            coverage.xml
            coverage.json
          retention-days: 7

  backend-interpreter-compatibility:
    name: Backend Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the canonical interpreter and is covered by the job above.
        # The newer interpreters are exercised here so that an interpreter
        # specific regression, such as the CPython 3.14 asyncio teardown
        # behaviour, is caught by the pipeline instead of by a user.
        python-version: ['3.13', '3.14']
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.lock
            backend/requirements-ci.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # The runtime dependencies are installed from the lock, with
          # --require-hashes, so the pipeline exercises exactly the versions
          # the container image ships and pip refuses any artefact whose hash
          # does not match the recorded one.
          pip install --require-hashes -r backend/requirements.lock
          pip install -r backend/requirements-ci.txt

      # Each interpreter in the matrix has to resolve the lock to the same
      # versions. A wheel that is only published for some of them would
      # otherwise show up as a silent substitution.
      - name: Verify the Installed Environment Matches the Lock
        run: python scripts/verify_locked_environment.py --lock backend/requirements.lock

      # The output is captured so that a failure can be reported as a
      # check-run annotation. `pipefail` is what keeps the pipeline honest:
      # without it `tee` would decide the exit status and a failing test
      # suite would pass the job.
      - name: Run Pytest
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. pytest \
            --junitxml=junit.xml \
            -W "error::pytest.PytestUnraisableExceptionWarning" \
            2>&1 | tee pytest-output.txt

      # A failing pipeline has to name the test that failed. The job log can
      # only be downloaded with repository administration rights, so the
      # failures are turned into check-run annotations, which the API exposes
      # to everyone who can read the repository.
      - name: Report the Failed Tests
        if: always()
        run: |
          python scripts/summarize_pytest_failures.py junit.xml
          {
            echo "## Backend test report"
            echo
            echo '```text'
            tail -n 100 pytest-output.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
