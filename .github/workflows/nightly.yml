name: Nightly Engineering Regression

on:
  schedule:
    - cron: '0 1 * * *'  # Run daily at 01:00 UTC
  workflow_dispatch:
    inputs:
      random_seed:
        description: 'Seeded random number generator seed'
        required: false
        default: '42'

permissions:
  contents: read

jobs:
  nightly-regression-suite:
    name: Nightly Long-Duration & High-Stress Regression Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Large Plant Topology Regression (50 MW / 200 MWh Variant)
        run: |
          PYTHONPATH=. pytest tests/test_plant_topology.py -k "test_variant_50mw_200mwh"

      - name: Long-Duration Battery Charge/Discharge Cycles Regression
        run: |
          PYTHONPATH=. pytest tests/test_battery_bms.py

      - name: Full Grid Services & Disturbances Regression
        run: |
          PYTHONPATH=. pytest tests/test_grid_services.py tests/test_grid_poi.py

      - name: Comprehensive Fault Injection & Recovery Scenarios
        run: |
          PYTHONPATH=. pytest tests/test_scenarios_fault_injection.py

      - name: High-Throughput Historian Ingestion Regression
        run: |
          PYTHONPATH=. pytest tests/test_historian_db.py

      - name: Full 20-Step End-to-End Demonstration Regression (Seed=42)
        run: |
          PYTHONPATH=. pytest tests/test_e2e_integration_demo.py

      - name: Upload Nightly Regression Reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-regression-artifacts
          path: |
            backend/app/historian/overflow/
            tests/
          retention-days: 30
