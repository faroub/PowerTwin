name: Nightly Engineering Regression

on:
  schedule:
    - cron: '0 1 * * *'  # Run daily at 01:00 UTC
  workflow_dispatch:
    inputs:
      random_seed:
        description: 'Seeded random number generator seed used by the endurance campaign'
        required: false
        default: '42'

permissions:
  contents: read

# A nightly run is never cancelled by a newer run: the endurance campaign is
# long running and cancelling it would waste the runner time it already used.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  nightly-regression-suite:
    name: Nightly Long-Duration & High-Stress Regression Suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.lock
            backend/requirements-ci.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # The runtime dependencies are installed from the lock, with
          # --require-hashes, so every job exercises exactly the versions the
          # container image ships.
          pip install --require-hashes -r backend/requirements.lock
          pip install -r backend/requirements-ci.txt

      # The lock says which versions must be installed; this says that the
      # versions that are installed are those. It also catches the toolchain
      # install above quietly replacing a runtime package with another one.
      - name: Verify the Installed Environment Matches the Lock
        run: python scripts/verify_locked_environment.py --lock backend/requirements.lock

      - name: Large Plant Topology Regression (50 MW / 200 MWh Variant)
        run: |
          PYTHONPATH=. pytest tests/test_plant_topology.py -k "test_variant_50mw_200mwh"

      - name: Long-Duration Battery Charge/Discharge Cycles Regression
        run: |
          PYTHONPATH=. pytest tests/test_battery_bms.py

      - name: Full Grid Services & Disturbances Regression
        run: |
          PYTHONPATH=. pytest tests/test_grid_services.py tests/test_grid_poi.py

      - name: Comprehensive Fault Injection & Recovery Scenarios
        run: |
          PYTHONPATH=. pytest tests/test_scenarios_fault_injection.py

      - name: High-Throughput Historian Ingestion Regression
        run: |
          PYTHONPATH=. pytest tests/test_historian_db.py

      - name: Full 20-Step End-to-End Demonstration Regression (Seed=42)
        run: |
          PYTHONPATH=. pytest tests/test_e2e_integration_demo.py

      - name: Endurance Campaign (Long-Duration Determinism & Drift Check)
        env:
          RANDOM_SEED: ${{ inputs.random_seed || '42' }}
        run: |
          PYTHONPATH=. python scripts/endurance_campaign.py \
            --ticks 360000 \
            --seed "${RANDOM_SEED}" \
            --repeats 2 \
            --report release_artifacts/endurance_campaign.json

      - name: Upload Nightly Regression Reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-regression-artifacts
          path: |
            backend/app/historian/overflow/
            release_artifacts/endurance_campaign.json
            tests/
          retention-days: 30
