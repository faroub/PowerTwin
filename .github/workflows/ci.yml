name: Main CI Workflow

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-ci:
    uses: ./.github/workflows/reusable-backend.yml

  frontend-ci:
    uses: ./.github/workflows/reusable-frontend.yml

  system-engineering-ci:
    name: System Engineering & Physics Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Reference Plant Configuration & Topology Validation
        run: |
          PYTHONPATH=. pytest tests/test_plant_topology.py

      - name: Physics & Energy-Balance Validation (Hypothesis)
        run: |
          PYTHONPATH=. pytest tests/test_hypothesis_physics.py

      - name: Battery SoC & BMS Protection Limits Validation
        run: |
          PYTHONPATH=. pytest tests/test_battery_bms.py

      - name: PCS P/Q Capability Circle & Ramp Limit Validation
        run: |
          PYTHONPATH=. pytest tests/test_pcs_bo_p.py

      - name: Deterministic Replay & Simulation Engine Clock Validation
        run: |
          PYTHONPATH=. pytest tests/test_simulation_engine.py

      - name: Fault Injection Scenarios & Criteria Evaluation
        run: |
          PYTHONPATH=. pytest tests/test_scenarios_fault_injection.py

      - name: End-to-End 20-Step Demonstration Workflow
        run: |
          PYTHONPATH=. pytest tests/test_e2e_integration_demo.py

  infrastructure-ci:
    name: Infrastructure & Docker Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet

      - name: Build Backend Docker Image
        run: |
          docker build -t powertwin-backend:ci-test -f deployment/Dockerfile.backend .

      - name: Build Frontend Docker Image
        run: |
          docker build -t powertwin-frontend:ci-test -f deployment/Dockerfile.frontend .

  ci-summary:
    name: Final CI Summary
    needs: [backend-ci, frontend-ci, system-engineering-ci, infrastructure-ci]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Print CI Status Summary
        run: |
          echo "======================================================="
          echo "            POWERTWIN CI SUMMARY REPORT                "
          echo "======================================================="
          echo "Backend CI:            ${{ needs.backend-ci.result }}"
          echo "Frontend CI:           ${{ needs.frontend-ci.result }}"
          echo "System Engineering CI: ${{ needs.system-engineering-ci.result }}"
          echo "Infrastructure CI:     ${{ needs.infrastructure-ci.result }}"
          echo "======================================================="

          if [ "${{ needs.backend-ci.result }}" != "success" ] || \
             [ "${{ needs.frontend-ci.result }}" != "success" ] || \
             [ "${{ needs.system-engineering-ci.result }}" != "success" ] || \
             [ "${{ needs.infrastructure-ci.result }}" != "success" ]; then
            echo "CI pipeline FAILED. One or more mandatory jobs failed, were cancelled, or were skipped."
            exit 1
          else
            echo "CI pipeline PASSED successfully."
          fi
