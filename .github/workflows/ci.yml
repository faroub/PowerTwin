name: Main CI Workflow

on:
  # Every pull request is tested, whatever branch it targets. Restricting the
  # trigger to `main` would leave the feature branches of a pull request
  # untested until the moment they are merged.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-ci:
    uses: ./.github/workflows/reusable-backend.yml

  frontend-ci:
    uses: ./.github/workflows/reusable-frontend.yml

  system-engineering-ci:
    name: System Engineering & Physics Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.lock
            backend/requirements-ci.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # The runtime dependencies are installed from the lock, with
          # --require-hashes, so every job exercises exactly the versions the
          # container image ships.
          pip install --require-hashes -r backend/requirements.lock
          pip install -r backend/requirements-ci.txt

      - name: Reference Plant Configuration & Topology Validation
        run: |
          PYTHONPATH=. pytest tests/test_plant_topology.py

      - name: Physics & Energy-Balance Validation (Hypothesis)
        run: |
          PYTHONPATH=. pytest tests/test_hypothesis_physics.py

      - name: Battery SoC & BMS Protection Limits Validation
        run: |
          PYTHONPATH=. pytest tests/test_battery_bms.py

      - name: PCS P/Q Capability Circle & Ramp Limit Validation
        run: |
          PYTHONPATH=. pytest tests/test_pcs_bo_p.py

      - name: Deterministic Replay & Simulation Engine Clock Validation
        run: |
          PYTHONPATH=. pytest tests/test_simulation_engine.py

      - name: Fault Injection Scenarios & Criteria Evaluation
        run: |
          PYTHONPATH=. pytest tests/test_scenarios_fault_injection.py

      - name: End-to-End 20-Step Demonstration Workflow
        run: |
          PYTHONPATH=. pytest tests/test_e2e_integration_demo.py

      - name: CI Helper Script Validation
        run: |
          PYTHONPATH=. pytest tests/test_ci_scripts.py

  infrastructure-ci:
    name: Infrastructure & Docker Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Docker Compose Configuration
        env:
          # docker-compose.yml declares POSTGRES_PASSWORD as mandatory
          # (${POSTGRES_PASSWORD:?...}), so the compose file cannot even be
          # parsed without it. This step validates the *syntax and the
          # interpolation* of the compose file; it does not start a container
          # and it does not connect to a database.
          #
          # The value below is a validation-only placeholder. It is not a
          # credential, it grants access to nothing, it is never written to a
          # file, it is never pushed anywhere and it exists only for the
          # duration of this step. The mandatory-variable requirement in
          # docker-compose.yml is deliberately left untouched, so a real
          # deployment still has to supply its own secret.
          POSTGRES_PASSWORD: "ci-compose-validation-placeholder-not-a-credential"
        run: |
          docker compose config --quiet

      - name: Build Backend Docker Image
        run: |
          docker build -t powertwin-backend:ci-test -f deployment/Dockerfile.backend .

      # Building the image is not evidence that the image works. This step
      # starts the container, waits for the image's own health probe to report
      # healthy and then checks the safety invariants of the running service.
      # It binds to the loopback interface only, exactly like the compose file.
      - name: Verify Backend Container Starts and Reports Healthy
        run: |
          set -euo pipefail
          container=powertwin-backend-ci-smoke
          docker rm -f "$container" >/dev/null 2>&1 || true
          docker run -d --name "$container" -p 127.0.0.1:8000:8000 powertwin-backend:ci-test >/dev/null
          status=""
          for _ in $(seq 1 30); do
            status="$(docker inspect --format='{{.State.Health.Status}}' "$container" 2>/dev/null || echo missing)"
            case "$status" in
              healthy|unhealthy) break ;;
            esac
            sleep 2
          done
          if [ "$status" != "healthy" ]; then
            echo "The backend container did not become healthy. Reported status: ${status:-unknown}"
            docker logs "$container" || true
            docker rm -f "$container" >/dev/null 2>&1 || true
            exit 1
          fi
          echo "The backend container reported healthy."
          python3 - <<'PY'
          import json
          import urllib.request

          with urllib.request.urlopen("http://127.0.0.1:8000/health/readiness", timeout=5) as response:
              body = json.load(response)
          safety = body["safety"]
          if safety.get("simulation_only") is not True:
              raise SystemExit(f"the running container does not report SIMULATION_ONLY: {safety}")
          if safety.get("hardware_integration_enabled") is not False:
              raise SystemExit(f"the running container reports hardware integration enabled: {safety}")
          print("The running container upholds the safety invariants:", safety.get("safety_status"))
          PY
          docker rm -f "$container" >/dev/null

      - name: Build Frontend Docker Image
        run: |
          docker build -t powertwin-frontend:ci-test -f deployment/Dockerfile.frontend .

  ci-summary:
    name: Final CI Summary
    needs: [backend-ci, frontend-ci, system-engineering-ci, infrastructure-ci]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print CI Status Summary
        run: |
          echo "======================================================="
          echo "            POWERTWIN CI SUMMARY REPORT                "
          echo "======================================================="
          echo "Backend CI:            ${{ needs.backend-ci.result }}"
          echo "Frontend CI:           ${{ needs.frontend-ci.result }}"
          echo "System Engineering CI: ${{ needs.system-engineering-ci.result }}"
          echo "Infrastructure CI:     ${{ needs.infrastructure-ci.result }}"
          echo "======================================================="

          if [ "${{ needs.backend-ci.result }}" != "success" ] || \
             [ "${{ needs.frontend-ci.result }}" != "success" ] || \
             [ "${{ needs.system-engineering-ci.result }}" != "success" ] || \
             [ "${{ needs.infrastructure-ci.result }}" != "success" ]; then
            echo "CI pipeline FAILED. One or more mandatory jobs failed, were cancelled, or were skipped."
            exit 1
          else
            echo "CI pipeline PASSED successfully."
          fi
