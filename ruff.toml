# Ruff configuration for the parts of the repository that are not covered by
# ``backend/pyproject.toml``: the helper scripts, the test suite, the
# equipment plugins and the container health check.
#
# Why this file exists
# ---------------------
# Ruff resolves its configuration **per file**, by walking up the directory
# tree from the file that is being linted. ``backend/`` has its own
# configuration in ``backend/pyproject.toml``, but ``scripts/``, ``tests/``,
# ``plugins/`` and ``deployment/`` did not have one.
#
# Without a configuration file of their own, those directories inherited
# whatever rule set happened to be configured outside the repository, or
# Ruff's built-in defaults when nothing was found. The practical consequence is
# that the lint result depended on the machine: a developer and the CI runner
# could legitimately disagree about whether the very same commit passes, and a
# green local run did not prove that CI would be green.
#
# This file pins the rule set **inside the repository**, so that the local
# result and the CI result are the same.
#
# This configuration and ``backend/pyproject.toml`` declare **the same** line
# length, the same target version and the same lint rule selection. The whole
# repository is therefore linted with one documented style: a line that is
# acceptable in one tree is acceptable in every tree, and a file that is
# formatted in one tree is formatted in all of them.
#
# The two files cannot be merged into one, because Ruff discovers its
# configuration by walking **up** the directory tree: ``backend/pyproject.toml``
# is not an ancestor of ``scripts/`` or ``tests/``, so those trees would fall
# back to Ruff's built-in defaults if the root file were removed. They are kept
# in step by ``tests/test_tool_configuration.py``, which fails when the two
# declarations diverge.
#
# E501 is active in both configurations. Ruff's formatter never reflows a
# docstring or a comment, so a tree can contain long prose lines that no
# formatter run will ever shorten; those lines are shortened by hand, and the
# linter enforces it.

line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
